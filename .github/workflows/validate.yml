name: Template portability checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci --no-fund --no-audit
      - name: Check runtime and release contracts
        run: |
          python scripts/doctor.py
          python -m unittest discover -s tests -v
      - name: Render offline preview (no TTS, no clinic data)
        run: python video.py --template ds-a --name "模板验证口腔" --logo templates/orthodontics/ds-a/examples/demo-logo.svg --preview --out output/ci-preview
      - name: Render HT视频001 offline preview (no TTS, no clinic data)
        run: python video.py --template ht-video-001 --name "美白模板验证口腔" --logo templates/whitening/ht-video-001/examples/demo-logo.svg --preview --out output/ci-ht-preview
      - name: Keep preview for human review
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.os }}
          path: |
            output/ci-preview/qa/
            output/ci-ht-preview/qa/
          retention-days: 7
